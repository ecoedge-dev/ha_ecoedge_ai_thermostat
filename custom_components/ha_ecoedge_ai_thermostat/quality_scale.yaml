# Home Assistant integration quality scale — self-assessment (v0.8.0).
# Not required for a custom integration; kept as the checklist towards Silver.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: Logo submission to home-assistant/brands is pending.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: User, reauth, options and import steps are tested; the reconfigure step is not yet.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: >-
      Offline-first by design. Readings are buffered in a persistent outbox, so
      setup never waits for the cloud; the first profile poll runs in the
      background and the sensors report unavailable until it succeeds.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Coverage is not measured yet.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service; nothing to discover on the local network.
  discovery-update-info:
    status: exempt
    comment: Cloud service; nothing to discover on the local network.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
