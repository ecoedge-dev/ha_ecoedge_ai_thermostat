[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# a hanging test fails instead of blocking CI (e.g. an outbox that keeps retrying)
timeout = 60
# xfail tests document open audit findings (docs/ha_integration_audit_2026-10.md in
# ha_ai_push); strict: a fix that makes one pass must also remove its marker.
xfail_strict = true
